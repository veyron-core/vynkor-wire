name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # prost-build regenerates bindings from proto/ in the build script,
      # so protoc must be present at compile time
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # version drift guard: PROTOCOL_VERSION in src/lib.rs must mirror the
      # leading `// v X.Y` header comment in proto/vynkor_protocol.proto —
      # they are bumped together on any protocol change
      - name: Protocol version matches proto header
        run: |
          PROTO_VER=$(grep -m1 -oP '^// v \K[0-9]+\.[0-9]+' proto/vynkor_protocol.proto)
          LIB_VER=$(grep -m1 -oP 'PROTOCOL_VERSION: &str = "\K[0-9]+\.[0-9]+' src/lib.rs)
          if [ -z "$PROTO_VER" ] || [ -z "$LIB_VER" ]; then
            echo "FAIL: could not extract version (proto='$PROTO_VER' lib='$LIB_VER')"
            exit 1
          fi
          if [ "$PROTO_VER" != "$LIB_VER" ]; then
            echo "FAIL: proto header v$PROTO_VER != lib.rs PROTOCOL_VERSION v$LIB_VER"
            exit 1
          fi
          echo "ok: protocol version $LIB_VER consistent"

      - name: Build
        run: cargo build --all-features

      - name: Tests
        run: cargo test --all-features

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Format check
        run: cargo fmt --check
